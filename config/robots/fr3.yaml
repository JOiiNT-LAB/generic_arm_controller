# Profilo robot: Franka Research 3 (Gazebo Sim, franka_gazebo_bringup + arm_gz_bringup)
# Un solo file passato a fk_node, ik_trajectory_node, gripper_node e
# task_executor_node_complete - ognuno legge solo i campi che dichiara.
/**:
  ros__parameters:

    # ----- Descrizione / xacro -----
    urdf_package: "franka_description"
    robot_type: "fr3"
    xacro_relative_path: "robots/fr3/fr3.urdf.xacro"
    xacro_args:
      - "robot_type:=fr3"
      - "hand:=true"
      - "ee_id:=franka_hand"

    # ----- Cinematica -----
    # Poses are always taken at the flange (last link), like on the real robot
    # (fr3_real.yaml uses panda_link8) and like the hand-eye calibration: this way saved
    # poses mean the same thing in simulation and on the real FR3.
    end_effector_frame: "fr3_link8"
    base_frame: "fr3_link0"
    # In simulation the camera is part of the robot model (arm_gz_bringup/urdf/
    # fr3_camera.gazebo.xacro, placed with the real hand-eye calibration), so its TF is
    # already published by robot_state_publisher: don't publish it a second time from
    # calibration_results/hand_eye_transform_<robot>.yaml.
    hand_eye_tf_from_urdf: true
    joint_names:
      - "fr3_joint1"
      - "fr3_joint2"
      - "fr3_joint3"
      - "fr3_joint4"
      - "fr3_joint5"
      - "fr3_joint6"
      - "fr3_joint7"

    # ----- Action server / topic -----
    # joint_trajectory_controller aggiunto a runtime da arm_gz_bringup/launch/fr3.launch.py
    # (franka_gazebo_bringup non lo espone di default - vedi arm_gz_bringup/config/fr3_controllers_gz.yaml)
    action_server_name: "/joint_trajectory_controller/follow_joint_trajectory"
    pose_topic:         "/target_cartesian_pose"
    joint_states_topic: "/joint_states"
    ik_result_topic:    "/ik_action_result"
    fk_pose_topic:      "/fk_pose"

    # ----- IK solver -----
    ik_tolerance:  0.001
    ik_max_iter:   4000
    ik_dt:         0.1
    ik_damping:    0.05

    # ----- Traiettoria -----
    trajectory_duration: 3.0
    # Joint-space safety limits (see ik_safety.py). The trajectory is stretched so no
    # joint exceeds max_joint_speed [rad/s]; a move where any joint travels more than
    # max_joint_step_rad [rad] is refused. 0 disables a limit. Starting values, tune per robot.
    max_joint_speed: 1.0
    max_joint_step_rad: 3.14

    # ----- Gripper -----
    default_gripper_type: "franka_hand"
    # Served in Gazebo by the franka_gripper GripperActionController that
    # arm_gz_bringup/launch/fr3.launch.py spawns (the standard action name is gripper_cmd).
    franka_hand_gripper_action: "/franka_gripper/gripper_cmd"

    # ----- Marker / visione (aggancio one-shot) -----
    # La posa del marker rispetto alla base viene misurata UNA VOLTA e poi
    # riusata per tutti i waypoint: il marker puo' uscire dall'inquadratura
    # durante l'avvicinamento senza far fallire nulla. Vedi marker_lock.py.
    camera_optical_frame: "camera_color_optical_frame"
    # Sotto questa distanza dalla camera la stima ArUco e' inaffidabile e la
    # rilevazione viene scartata (non usata per agganciare).
    marker_min_reliable_distance_m: 0.20
    # Eta' massima della rilevazione: senza questo controllo il buffer tf2
    # continua a restituire l'ultima detection per 10 s dopo che il marker e'
    # sparito, senza sollevare eccezioni.
    marker_max_tf_age_s: 0.5
    # Numero di rilevazioni mediate per acquisire l'aggancio. La dispersione
    # tra i campioni viene loggata: e' l'indice di qualita' della rilevazione.
    marker_lock_samples: 5
    # 'once' = misura una volta per sequenza (default, corretto per il pick).
    # 'live' = rilegge a ogni waypoint (comportamento storico, solo per debug).
    marker_lock_mode: "once"
