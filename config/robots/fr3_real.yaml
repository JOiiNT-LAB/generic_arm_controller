# Profilo robot: Franka Research 3 REALE (bring-up franka_ros2 v0.1.8 su PC
# real-time separato, non Gazebo — vedi fr3.yaml per la variante sim).
# Naming panda_* (non fr3_*): il firmware del Control Box del robot fisico
# è compatibile solo con franka_ros2 <= v0.1.8, che non ha ancora il naming
# fr3_*. Vedi ros2_ws/src/robots/franka/franka_description_panda_legacy/README.md
# per il motivo per cui questo profilo usa un pacchetto URDF diverso da fr3.yaml.
/**:
  ros__parameters:

    # ----- Descrizione / xacro -----
    urdf_package: "franka_description_panda_legacy"
    xacro_relative_path: "robots/panda_kinematic.urdf.xacro"
    xacro_args:
      - "arm_id:=panda"
      - "hand:=true"

    # ----- Cinematica -----
    # end_effector_frame = panda_link8 (flangia), NON panda_hand_tcp: il
    # robot_state_publisher reale sul PC real-time pubblica un URDF senza
    # mano, fermo a panda_link8 - panda_hand_tcp non è quindi MAI raggiungibile
    # come TF live (nessun nodo lo pubblica: non fk_node, che scrive solo un
    # numero su /fk_pose, non il bring-up reale, non il bridge di rviz_bridge.
    # launch.py, disconnesso apposta da /joint_states). Con panda_hand_tcp
    # configurato qui, ogni lookup_transform su quel frame (es. task_saving_
    # node/save_pose) falliva, e le voci "riuscite" viste in passato in
    # robot_poses_ws.json risalgono a test precedenti (probabilmente in
    # simulazione, dove l'URDF con mano è realmente pubblicato in TF) - non
    # sono replicabili sul robot reale con questo bring-up. panda_link8 è
    # anche il frame usato dalla calibrazione hand-eye camera (vedi
    # calibration_results/hand_eye_transform_fr3_real.yaml), quindi tutta la
    # pipeline (calibrazione, pose salvate, target IK) resta coerente nello
    # stesso riferimento realmente esistente nell'albero TF. Le pose/target
    # sono quindi relative alla flangia, non alla punta della Franka Hand
    # (differenza pari alla lunghezza della mano, ~10cm).
    end_effector_frame: "panda_link8"
    base_frame: "panda_link0"
    joint_names:
      - "panda_joint1"
      - "panda_joint2"
      - "panda_joint3"
      - "panda_joint4"
      - "panda_joint5"
      - "panda_joint6"
      - "panda_joint7"

    # ----- Action server / topic -----
    # joint_trajectory_controller è avviato dal bring-up sul PC real-time
    # (franka_ros2 v0.1.8, run_real.sh) - qui ci si limita a collegarsi.
    action_server_name: "/joint_trajectory_controller/follow_joint_trajectory"
    pose_topic:         "/target_cartesian_pose"
    joint_states_topic: "/joint_states"
    ik_result_topic:    "/ik_action_result"
    fk_pose_topic:      "/fk_pose"

    # ----- IK solver -----
    ik_tolerance:  0.001
    ik_max_iter:   4000
    ik_dt:         0.1
    ik_damping:    0.05

    # ----- Traiettoria -----
    trajectory_duration: 3.0

    # ----- Gripper -----
    default_gripper_type: "franka_hand"
    # Il wrapper control_msgs/GripperCommand (/panda_gripper/gripper_action) sul
    # bring-up reale si è rivelato inaffidabile (non riapre dopo una chiusura) -
    # usiamo le azioni native Move/Grasp dello stesso bring-up, verificate
    # affidabili a mano via `ros2 action send_goal`. Richiede una Homing
    # (ros2 action send_goal /panda_gripper/homing franka_msgs/action/Homing "{}")
    # una volta dopo l'avvio del bring-up, altrimenti i comandi falliscono "out of range".
    franka_hand_native_actions: true
    franka_hand_namespace: "/panda_gripper"

    # ----- Marker / visione (aggancio one-shot) -----
    # La posa del marker rispetto alla base viene misurata UNA VOLTA e poi
    # riusata per tutti i waypoint: il marker puo' uscire dall'inquadratura
    # durante l'avvicinamento senza far fallire nulla. Vedi marker_lock.py.
    camera_optical_frame: "camera_color_optical_frame"
    # Sotto questa distanza dalla camera la stima ArUco e' inaffidabile e la
    # rilevazione viene scartata (non usata per agganciare).
    marker_min_reliable_distance_m: 0.20
    # Eta' massima della rilevazione: senza questo controllo il buffer tf2
    # continua a restituire l'ultima detection per 10 s dopo che il marker e'
    # sparito, senza sollevare eccezioni.
    marker_max_tf_age_s: 0.5
    # Numero di rilevazioni mediate per acquisire l'aggancio. La dispersione
    # tra i campioni viene loggata: e' l'indice di qualita' della rilevazione.
    marker_lock_samples: 5
    # 'once' = misura una volta per sequenza (default, corretto per il pick).
    # 'live' = rilegge a ogni waypoint (comportamento storico, solo per debug).
    marker_lock_mode: "once"
